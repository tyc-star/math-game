<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 寶可夢數學大師挑戰 ⚡</title>
    <style>
        :root {
            --primary: #ffcb05; /* 寶可夢黃 */
            --secondary: #3b4cca; /* 寶可夢藍 */
            --success: #4caf50;
            --dark: #111a2e;
            --light: #f4f4f9;
            --rarity-n: #a8a878;
            --rarity-r: #f08030;
            --rarity-sr: #a040a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #111a2e 0%, #060913 100%);
            color: var(--light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            text-shadow: 2px 2px 0px var(--secondary), -2px -2px 0px var(--secondary), 2px -2px 0px var(--secondary), -2px 2px 0px var(--secondary);
            margin: 0;
            font-size: 26px;
        }

        .diamond-status {
            font-size: 22px;
            font-weight: bold;
            color: #50e3c2;
            text-shadow: 0 0 10px rgba(80,227,194,0.5);
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #50e3c2;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .game-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 數學挑戰區 */
        .math-box h2 { color: var(--primary); margin-top: 0; font-size: 20px; }
        .question { font-size: 38px; font-weight: bold; margin: 20px 0; color: #fff; letter-spacing: 2px; }
        input[type="number"] {
            font-size: 24px;
            width: 120px;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid var(--secondary);
            text-align: center;
            margin-right: 10px;
            background: #222;
            color: #fff;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-submit { background-color: var(--success); color: white; }
        .btn-submit:hover { transform: scale(1.05); background-color: #439e47; }

        /* 扭蛋商店區 */
        .gacha-box h2 { color: #ff5b5b; margin-top: 0; font-size: 20px; }
        .egg-display {
            font-size: 70px;
            margin: 15px 0;
            cursor: pointer;
            display: inline-block;
        }
        .egg-shake {
            animation: shake 0.5s ease infinite;
        }
        @keyframes shake {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-10deg) scale(1.1); }
            40% { transform: rotate(10deg) scale(1.1); }
            60% { transform: rotate(-10deg) scale(1.1); }
            80% { transform: rotate(10deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .btn-gacha { background: linear-gradient(180deg, #ff5b5b 50%, #fff 50%); color: #333; width: 100%; margin-top: 10px; border: 2px solid #333; text-shadow: 1px 1px 0 #fff; cursor: pointer; font-weight: bold;}
        .btn-gacha:hover { transform: scale(1.03); box-shadow: 0 0 10px rgba(255,91,91,0.5); }

        /* 抽中通知彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #151922;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid var(--primary);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(255, 203, 5, 0.3);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 寶可夢卡片樣式 */
        .monster-card {
            width: 130px;
            background: #222631;
            border-radius: 12px;
            padding: 12px 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: inline-block;
            margin: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid #444;
            transition: transform 0.2s;
        }
        .monster-card:hover { transform: translateY(-5px); }
        .card-n { border-color: var(--rarity-n); }
        .card-r { border-color: var(--rarity-r); box-shadow: 0 0 12px rgba(240, 128, 48, 0.4); }
        .card-sr { border-color: var(--rarity-sr); box-shadow: 0 0 15px rgba(160, 64, 160, 0.6); animation: glow 1.5s ease-in-out infinite alternate; }
        
        @keyframes glow {
            0% { box-shadow: 0 0 10px rgba(160, 64, 160, 0.4); border-color: #a040a0; }
            100% { box-shadow: 0 0 25px rgba(216, 113, 216, 0.9); border-color: #ff88ff; }
        }
        
        .rarity-tag {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            display: inline-block;
            margin-bottom: 8px;
        }
        .tag-n { background: var(--rarity-n); color: #fff; }
        .tag-r { background: var(--rarity-r); }
        .tag-sr { background: linear-gradient(45deg, #a040a0, #ff88ff); text-shadow: 1px 1px 0px #000; }
        
        .monster-img-container {
            width: 95px;
            height: 95px;
            margin: 0 auto 5px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 5px;
        }
        .monster-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .monster-name { font-weight: bold; font-size: 14px; color: #fff; margin-top: 5px;}

        /* 圖鑑區 */
        .collection-box {
            margin-top: 20px;
            width: 100%;
        }
        .collection-box h2 { color: var(--secondary); margin-top: 0; font-size: 20px; text-shadow: 1px 1px 0 #000; }
        .collection-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 120px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .empty-tip { color: #888; font-style: italic; margin-top: 45px; font-size: 14px; }
        .btn-reset { background-color: #333; color: #999; font-size: 11px; padding: 5px 10px; border-radius: 5px; margin-top: 20px; border: 1px solid #444; cursor: pointer; }
        .btn-reset:hover { background-color: #c0392b; color: white; border-color: #c0392b; }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>🔴 寶可夢數學大師挑戰 🔴</h1>
            <div class="diamond-status">💎 <span id="diamond-count">0</span></div>
        </header>

        <div class="game-grid">
            <!-- 數學挑戰區 -->
            <div class="panel math-box">
                <h2>🎯 答題挑戰</h2>
                <p style="font-size: 13px; color: #aaa;">答對即可獲得 💎 5 顆鑽石！</p>
                <div class="question" id="question-text">7 × 3 = ?</div>
                <div style="display: flex; justify-content: center; align-items: center;">
                    <input type="number" id="user-answer" placeholder="?" onkeydown="if(event.key==='Enter') checkAnswer()">
                    <button class="btn-submit" onclick="checkAnswer()">送出</button>
                </div>
            </div>

            <!-- 扭蛋商店區 -->
            <div class="panel gacha-box">
                <h2>🎒 捕捉精靈商店</h2>
                <p style="font-size: 13px; color: #aaa;">消耗 💎 10 顆鑽石丟出精靈球！</p>
                <div class="egg-display" id="egg-element">🔴</div>
                <button class="btn-gacha" onclick="startGacha()">投擲精靈球 💎x10</button>
                <div style="font-size: 11px; color: #888; margin-top: 8px;">機率：傳說SR(10%) | 稀有R(30%) | 普通N(60%)</div>
            </div>
        </div>

        <!-- 寶可夢圖鑑區 -->
        <div class="panel collection-box">
            <h2>📜 我的寶可夢背包 (<span id="collection-count">0</span>)</h2>
            <div class="collection-list" id="collection-container">
                <span class="empty-tip">目前背包空空如也，快去賺鑽石抽寶可夢吧！</span>
            </div>
